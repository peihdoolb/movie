name: Build & Release PeihMovie APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APKs
        run: |
          gradle assembleDebug assembleRelease --stacktrace

      - name: Rename APKs
        run: |
          mkdir -p release-apks
          cp app/build/outputs/apk/debug/app-debug.apk release-apks/PeihMovie-debug.apk
          cp app/build/outputs/apk/release/app-release.apk release-apks/PeihMovie-release.apk

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PeihMovie-APKs
          path: release-apks/*
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: PeihMovie v1.0.0
          body: |
            ## 🎉 Peih Movie Player v1.0.0
            
            Ứng dụng xem phim độc lập, mã nguồn mở:
            - ✅ Không bị kiểm tra hay khóa từ xa.
            - ✅ Tích hợp sẵn nguồn phim KKPhim, OPhim và các plugin cộng đồng.
            - ✅ Hỗ trợ ExoPlayer phát m3u8 siêu mượt.
            
            ### Tải về cài đặt:
            - **[PeihMovie-release.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.0/PeihMovie-release.apk)**
          files: |
            release-apks/PeihMovie-release.apk
            release-apks/PeihMovie-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
