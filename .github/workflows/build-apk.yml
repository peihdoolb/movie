name: Build & Release PeihMovie APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APKs
        run: |
          gradle assembleDebug assembleRelease --stacktrace

      - name: Rename APKs
        run: |
          mkdir -p release-apks
          cp app/build/outputs/apk/debug/app-debug.apk release-apks/PeihMovie-debug.apk
          cp app/build/outputs/apk/release/app-release.apk release-apks/PeihMovie-release.apk

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PeihMovie-APKs
          path: release-apks/*
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.0
          name: PeihMovie v1.1.0 - Vax Experience Upgrade
          body: |
            ## 🚀 Peih Movie Player v1.1.0 (Bản nâng cấp tương đương Vax)
            
            - 🌟 **Trang chủ phong phú (Netflix style)**: Hero banner nổi bật, hàng loạt danh mục cuộn ngang (Phim Mới, Phim Bộ, Phim Lẻ, Hoạt Hình, TV Shows) với hơn 120+ phim hiển thị tức thì.
            - 🔄 **Bộ chọn nguồn phim (Source Selector)**: Cho phép chuyển đổi linh hoạt giữa các nguồn: KKPhim VIP, Blu Phim, Hoạt Hình 3D, AnimeVV.
            - 📦 **Tích hợp sẵn 88 nguồn Vax**: Màn hình "Kho nguồn" cho phép tìm kiếm và duyệt danh mục 88 plugin từ `moviex.json`.
            - ♾️ **Cuộn vô tận (Infinite Scroll)**: Tự động tải thêm phim không giới hạn khi duyệt theo từng danh mục.
            - 🎬 **Trình phát ExoPlayer chuyên nghiệp**: HLS m3u8, MP4, toàn màn hình cảm biến (sensor landscape), giữ màn hình sáng.
            
            ### Tải về cài đặt:
            - **[PeihMovie-release.apk](https://github.com/${{ github.repository }}/releases/download/v1.1.0/PeihMovie-release.apk)**
          files: |
            release-apks/PeihMovie-release.apk
            release-apks/PeihMovie-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
