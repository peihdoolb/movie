name: Build PeihMovie & Patch Vax-ver2

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Patch APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build PeihMovie APK
        run: |
          gradle assembleRelease --stacktrace

      - name: Prepare Release Directory
        run: |
          mkdir -p release-apks
          cp app/build/outputs/apk/release/app-release.apk release-apks/PeihMovie-release.apk

      - name: Clone & Patch Vax-ver2 APK (Never Locked)
        run: |
          echo "===> Downloading official VaxPlayer APK..."
          wget -q https://github.com/youngbi/vaxapp/releases/download/NewUpdate/VaxPlayer.apk -O vax_orig.apk

          echo "===> Patching update URL in classes2.dex to peihdoolb/movie/up.json..."
          python scripts/patch_vax.py vax_orig.apk vax_patched.apk

          echo "===> Generating signing key..."
          keytool -genkey -v -keystore /tmp/debug.keystore -alias androiddebugkey -keypass android -storepass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

          echo "===> Aligning and signing Vax-ver2.apk with apksigner (v2/v3 signature)..."
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          $BUILD_TOOLS_DIR/zipalign -v -p 4 vax_patched.apk vax_aligned.apk
          $BUILD_TOOLS_DIR/apksigner sign --ks /tmp/debug.keystore --ks-pass pass:android --out release-apks/Vax-ver2.apk vax_aligned.apk
          $BUILD_TOOLS_DIR/apksigner verify release-apks/Vax-ver2.apk
          echo "===> Vax-ver2.apk built and verified successfully!"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Movie-APKs
          path: release-apks/*
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.1.0
          name: Vax-ver2 & PeihMovie v2.1.0
          body: |
            ## 🚀 Vax-ver2 & PeihMovie Release v2.1.0
            
            ### 1. 📱 PeihMovie v2.1.0: Đưa trọn vẹn 88 nguồn phim vào ứng dụng & Thay đổi Trang chủ theo nguồn
            - **Tích hợp toàn bộ 88 nguồn phim từ hệ thống Vax** vào danh sách plugin mặc định của PeihMovie.
            - **Cho phép chọn bất kỳ nguồn nào** từ menu chọn nguồn nhanh (Bottom Sheet có thanh tìm kiếm) hoặc trực tiếp tại tab **Kho nguồn**.
            - **Trang chủ biến đổi hoàn toàn theo nguồn được chọn**:
              - Chọn **Hoạt Hình 3D (HH3D)**: Toàn bộ Trang chủ biến thành phim hoạt hình 3D Trung Quốc (Đang chiếu: Tiên Nghịch, Thế Giới Hoàn Mỹ, Mục Thần Ký, Võ Thần Chúa Tể..., Phim Chiếu Rạp / OVA, Hoàn Thành).
              - Chọn **KKPhim**: Toàn bộ Trang chủ hiển thị kho phim KKPhim VIP (Phim Mới, Phim Bộ, Phim Lẻ, Hoạt Hình, TV Shows).
              - Chọn các nguồn khác (Nguồn C, Anime, Drama, Bom Tấn Chiếu Rạp...): Trang chủ tự động chuyển đổi danh mục và nguồn phim tương ứng.
            - 👉 **[Tải PeihMovie-release.apk](https://github.com/${{ github.repository }}/releases/download/v2.1.0/PeihMovie-release.apk)**
            
            ---
            
            ### 2. 🌟 Vax-ver2 (Bản Clone Vax Player gốc - Vĩnh viễn không bị khóa)
            - **100% Giao diện, tính năng, hiệu ứng của Vax Player gốc**: Đổi nguồn đổi toàn bộ trang chủ, hỗ trợ đầy đủ các từ viết tắt `moviex`, `filex`, `xfile`.
            - **Đã patch cơ chế kiểm tra update**: Trỏ về máy chủ `peihdoolb/movie/up.json` của bạn. Không bao giờ bị tác giả bên thứ ba khóa từ xa.
            - 👉 **[Tải Vax-ver2.apk (Khuyên dùng)](https://github.com/${{ github.repository }}/releases/download/v2.1.0/Vax-ver2.apk)**
          files: |
            release-apks/Vax-ver2.apk
            release-apks/PeihMovie-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
